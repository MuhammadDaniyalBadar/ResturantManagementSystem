# Beta, free plans only: web service + Postgres + Redis (Key Value).
# Free limits: the app sleeps after 15 idle minutes (first visit then takes about a minute), the free
# database expires after 30 days, and uploaded photos are lost when the app restarts (no disk on free).
# To upgrade later: plan "starter" + the disk block below for the web service, "basic-256mb" for the database.
databases:
  - name: restaurant-db
    plan: free
    databaseName: restaurant
    user: restaurant

services:
  - type: keyvalue
    name: restaurant-redis
    plan: free
    ipAllowList: []  # reachable only from your own Render services

  - type: web
    name: restaurant
    runtime: docker
    plan: free
    healthCheckPath: /healthz/
    # disk:            # paid plans only; keeps uploaded photos across restarts
    #   name: media
    #   mountPath: /data/media
    #   sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: restaurant-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: DEBUG
        value: "0"
      - key: BEHIND_PROXY
        value: "1"
      # Set these in the Render dashboard to send real invoice emails (e.g. Gmail app password, SendGrid, Brevo).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
