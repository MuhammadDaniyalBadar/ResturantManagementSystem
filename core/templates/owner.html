{% extends "base.html" %}
{% block title %}Overview · {{ restaurant.name }}{% endblock %}
{% block bodyclass %}ops{% endblock %}
{% block body %}
{% include "_rail.html" with active="owner" %}
<div class="pagehead"><div><h1>Overview</h1><p>Tonight at a glance, updated live.</p></div></div>
<main class="page" style="padding-top: 20px" id="main"></main>
{% endblock %}
{% block script %}
<script>
const $ = (s) => document.querySelector(s);
let first = true;
const rise = (i) => (first ? { class: 'rise', style: `--i:${i}` } : {});
const A = (c, i) => ({ class: (first ? 'rise ' : '') + c, style: first ? `--i:${i}` : '' });

const kpi = (label, value, i) => h('div', { class: 'kpi', style: first ? `--i:${i}` : 'animation:none' }, h('span', { class: 'muted sm b' }, label), h('b', {}, value));
const card = (title, sub, i, ...kids) => h('section', { ...A('card', i), style: (first ? `--i:${i};` : '') + 'padding:20px;gap:12px' },
  h('h2', { class: 'd', style: 'font-size:20px;font-weight:700' }, title, sub ? h('span', { class: 'muted sm', style: 'font-family:var(--font-b);font-weight:600;margin-left:8px' }, sub) : null), kids);

function bars(days) {
  const W = 320, H = 150, max = Math.max(1, ...days.map((d) => d.sales)), bw = (W - 24) / days.length, hi = days.reduce((b, d, i, a) => (d.sales > a[b].sales ? i : b), 0);
  const parts = days.map((d, i) => {
    const hgt = Math.max(2, (H - 44) * d.sales / max), x = 12 + i * bw + bw * .16, cx = x + bw * .34;
    return `<rect x="${x.toFixed(1)}" y="${(H - 24 - hgt).toFixed(1)}" width="${(bw * .68).toFixed(1)}" height="${hgt.toFixed(1)}" rx="5" fill="${i === hi && d.sales ? 'url(#gb)' : '#2a3140'}"/>`
      + (d.sales ? `<text x="${cx.toFixed(1)}" y="${(H - 28 - hgt).toFixed(1)}" font-size="10" font-weight="700" fill="#e9ecf1" text-anchor="middle">${Math.round(d.sales)}</text>` : '')
      + `<text x="${cx.toFixed(1)}" y="${H - 8}" font-size="10" fill="#8e97a8" text-anchor="middle">${d.label}</text>`;
  }).join('');
  return svg(`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales for each of the last seven days" style="display:block"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ea0ff"/><stop offset="1" stop-color="#3b78f0"/></linearGradient></defs>${parts}</svg>`);
}
function area(hours) {
  const W = 320, H = 150, max = Math.max(1, ...hours.map((x) => x.orders)), step = (W - 28) / (hours.length - 1);
  const pts = hours.map((x, i) => [14 + i * step, H - 26 - (H - 50) * x.orders / max]), pk = hours.reduce((b, x, i, a) => (x.orders > a[b].orders ? i : b), 0);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const labels = hours.map((x, i) => (i % 2 === 0 ? `<text x="${pts[i][0].toFixed(1)}" y="${H - 8}" font-size="10" fill="#8e97a8" text-anchor="middle">${x.hour}</text>` : '')).join('');
  return svg(`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Orders per hour over the last seven days" style="display:block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c8dff" stop-opacity=".35"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></linearGradient></defs>`
    + `<path d="${line} L${pts.at(-1)[0].toFixed(1)} ${H - 26} L14 ${H - 26}Z" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#ffb020" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
    + (max > 1 || hours[pk].orders ? `<circle cx="${pts[pk][0].toFixed(1)}" cy="${pts[pk][1].toFixed(1)}" r="4.5" fill="#4c8dff"/><text x="${pts[pk][0].toFixed(1)}" y="${(pts[pk][1] - 9).toFixed(1)}" font-size="10" font-weight="700" fill="#e9ecf1" text-anchor="middle">${hours[pk].orders}</text>` : '') + labels + '</svg>');
}
const mins = (s) => (s === null ? '–' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'));
const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);

function render(d) {
  const cur = d.currency, best = d.best, top = Math.max(1, ...best.map((b) => b.qty));
  const live = d.tables.map((t) => h('div', { class: 'row', style: 'gap:10px' }, h('span', { class: 'bb', style: 'min-width:34px' }, 'T' + t.n), h('span', { class: 'st ' + t.status }, t.status), h('span', { class: 'muted sm grow', style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, t.guests.length ? t.guests.join(', ') : ''), t.bill ? h('span', { class: 'num b' }, money(cur, t.bill.total)) : null));
  const setup = d.setup.length ? h('section', { class: 'card', style: 'padding:20px;gap:12px;margin-bottom:18px;border-color:var(--acc)' },
    h('div', { class: 'spread' }, h('h2', { style: 'font-size:16px;font-weight:650' }, 'Get your restaurant ready'), h('span', { class: 'muted sm' }, d.setup.filter((s) => s.done).length + ' of ' + d.setup.length + ' done')),
    h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px' }, d.setup.map((s, i) => h('a', { href: s.url, class: 'row', style: 'gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg)' + (s.done ? ';opacity:.55' : '') },
      h('span', { class: 'tag ' + (s.done ? 'em' : ''), style: 'min-width:22px;text-align:center' }, s.done ? '✓' : String(i + 1)), h('span', { class: 'b' }, s.label))))) : null;
  $('#main').replaceChildren(
    ...(setup ? [setup] : []),
    h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px' },
      kpi('Tables in use', d.tables_in_use + ' / ' + d.tables_total, 0), kpi('Orders today', d.orders_today, 1), kpi('Sales today', money(cur, d.sales_today), 2), kpi('Average prep time', mins(d.avg_prep), 3)),
    h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:18px' },
      card('Sales by day', cur, 3, bars(d.days)),
      card('Peak hours', 'orders per hour', 4, area(d.hours)),
      card('Best sellers this week', '', 5, best.length ? h('div', { style: 'display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:10px 12px;align-items:center' }, best.map((b, i) => [
        plate(b.art, b.name, 40, 'flat'), h('div', { class: 'col', style: 'gap:4px' }, h('span', { class: 'b' }, b.name), h('div', { class: 'hbar', style: `width:${b.qty / top * 100}%;${first ? `--i:${i}` : 'animation:none'}` })), h('span', { class: 'num bb', style: 'text-align:right' }, b.qty)])) : h('div', { class: 'empty' }, 'No orders yet this week.')),
      card('Live floor', '', 6, h('div', { class: 'col', style: 'gap:10px' }, live)),
      card('Guest reviews', d.rating ? d.rating + ' average · ' + d.review_count + (d.review_count === 1 ? ' review' : ' reviews') : '', 7, d.reviews.length ? d.reviews.map((r) => h('div', { class: 'col', style: 'gap:2px;padding:8px 0;border-bottom:1px solid var(--line)' }, h('div', { class: 'spread' }, h('span', { style: 'color:#e6b04b;letter-spacing:2px', 'aria-label': r.stars + ' out of 5' }, stars(r.stars)), h('span', { class: 'muted sm' }, r.guest + ' · Table ' + r.table + ' · ' + ago(r.age))), r.comment ? h('span', {}, r.comment) : null)) : h('div', { class: 'empty' }, 'No reviews yet.'))));
  first = false;
}
async function refresh() { render(await api('/owner/data/')); }
live('/ws/staff/', refresh, 15000);
</script>
{% endblock %}
